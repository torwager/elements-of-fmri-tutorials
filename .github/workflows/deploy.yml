name: Build and deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Book lives under /book/ ; the custom landing page sits at the site root
  BASE_URL: /${{ github.event.repository.name }}/book
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install MyST
        run: npm install -g mystmd
      - name: Build book
        run: myst build --html
      - name: Assemble site (landing page at root, book under /book/)
        run: |
          mkdir -p dist
          cp -r landing/. dist/
          mkdir -p dist/book
          cp -r _build/html/. dist/book/
          # Empty local wheel index for JupyterLite/piplite (%pip install):
          # without it, piplite 404s on pypi/all.json and package installs fail.
          mkdir -p dist/book/pypi
          echo '{}' > dist/book/pypi/all.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
